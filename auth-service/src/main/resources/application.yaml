spring:
  application:
    name: auth-service
  grpc:
    server:
      port: ${AUTH_GRPC_PORT:9091}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL}"
      - "vault:///secret/data/auth-service"

  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE
      app-role:
        role-id: ${AUTH_VAULT_ROLE_ID}
        secret-id: ${AUTH_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2

