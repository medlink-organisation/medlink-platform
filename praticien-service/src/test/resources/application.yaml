spring:
  application:
    name: praticien-service
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
    bus:
      enabled: false
  datasource:
    url: jdbc:h2:mem:praticien-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/test-jwks
          issuer-uri: http://localhost/test-issuer
  grpc:
    server:
      port: 0
eureka:
  client:
    enabled: false
