spring:
  application:
    name: praticien-service

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL}"
      - "vault:///secret/data/praticien-service"


  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE
      app-role:
        role-id: ${PRATICIEN_VAULT_ROLE_ID}
        secret-id: ${PRATICIEN_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
