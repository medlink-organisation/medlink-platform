spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8899}"
      - "vault:///secret/data/gateway-service"

  cloud:

    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE
      app-role:
        role-id: ${GATEWAY_VAULT_ROLE_ID}
        secret-id: ${GATEWAY_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: notification-api-prefixed
              uri: lb://notification-service
              predicates:
                - Path=/notification-service/api/notifications,/notification-service/api/notifications/**
              filters:
                - StripPrefix=1
            - id: notification-api
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications,/api/notifications/**
            - id: notification-audit
              uri: lb://notification-service
              predicates:
                - Path=/api/admin/audit/notification,/api/admin/audit/notification/**
              filters:
                - RewritePath=/api/admin/audit/notification(?<segment>/?.*), /api/admin/audit$\{segment}





