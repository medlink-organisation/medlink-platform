
spring:

  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPOS}

          default-label: main
          clone-on-start: true
        monitor:
          github:
            webhook-secret: ${GITHUB_WEBHOOK_SECRET}
    discovery:
      enabled: true
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS}
server:
  port: 8899

management:
  endpoints:
    web:
      exposure:
        include: "*"
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
