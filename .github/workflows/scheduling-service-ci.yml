name: scheduling-service CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "scheduling-service/**"
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "scheduling-service/**"
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/reusable-service-ci-cd.yml
    with:
      service: scheduling-service
      image_name: medaligdira/scheduling-service
      gitops_file: values/local/applications/scheduling-service.yaml
    secrets: inherit
