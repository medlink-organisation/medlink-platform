name: notification-service CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "notification-service/**"
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "notification-service/**"
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    uses: ./.github/workflows/reusable-service-ci-cd.yml
    with:
      service: notification-service
      image_name: medaligdira/notification-service
      gitops_file: values/local/applications/notification-service.yaml
    secrets: inherit
