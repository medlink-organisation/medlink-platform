name: grpc-contracts CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "grpc-contracts/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test gRPC contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Build and test contracts with reactor dependencies
        run: |
          chmod +x auth-service/mvnw
          ./auth-service/mvnw -B -f pom.xml -pl grpc-contracts -am verify
