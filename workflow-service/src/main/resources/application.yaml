server:
  port: 8069

spring:
  application:
    name: workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL}"
      - "optional:vault:///secret/data/workflow-service"

  grpc:
    server:
      port: ${WORKFLOW_GRPC_PORT:9094}
    client:
      channel:
        scheduling-service:
          target: ${SCHEDULING_GRPC_TARGET:static://localhost:9093}
        auth-service:
          target: ${AUTH_GRPC_TARGET:static://localhost:9091}
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://localhost:9092}
        medical-record-service:
          target: ${MEDICAL_RECORD_GRPC_TARGET:static://localhost:9095}

  cloud:
    stream:
      bindings:
        notificationEvents-out-0:
          destination: ${NOTIFICATION_TOPIC}
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      app-role:
        role-id: ${WORKFLOW_VAULT_ROLE_ID}
        secret-id: ${WORKFLOW_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2

---
spring:
  config:
    activate:
      on-profile: dev
  grpc:
    client:
      channel:
        medical-record-service:
          target: ${MEDICAL_RECORD_GRPC_TARGET:static://medical-record-service:9095}

