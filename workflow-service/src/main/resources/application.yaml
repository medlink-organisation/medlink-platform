server:
  port: 8065

spring:
  application:
    name: workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL}"
      - "vault:///secret/data/auth-service"


  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE
      app-role:
        role-id: ${WORKFLOW_VAULT_ROLE_ID}
        secret-id: ${WORKFLOW_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2