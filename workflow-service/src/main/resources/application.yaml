server:
  port: 8065

spring:
  application:
    name: workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8899}"
      - "optional:vault:///secret/data/workflow-service"

  grpc:
    server:
      port: ${WORKFLOW_GRPC_PORT:9094}
    client:
      channel:
        scheduling-service:
          target: ${SCHEDULING_GRPC_TARGET:static://localhost:9093}
        auth-service:
          target: ${AUTH_GRPC_TARGET:static://localhost:9091}
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://localhost:9092}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      app-role:
        role-id: ${WORKFLOW_VAULT_ROLE_ID}
        secret-id: ${WORKFLOW_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
