

spring:
  application:
    name: scheduling-service
  grpc:
    server:
      port: ${SCHEDULING_GRPC_PORT:9093}
    client:
      channel:
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://localhost:9092}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8899}"
      - "optional:vault:///secret/data/scheduling-service"

  cloud:

    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      app-role:
        role-id: ${SCHEDULING_VAULT_ROLE_ID}
        secret-id: ${SCHEDULING_VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2

medlink:
  directory:
    base-url: ${DIRECTORY_SERVICE_URL:http://directory-service:8060}

---
spring:
  config:
    activate:
      on-profile: dev
  grpc:
    client:
      channel:
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://praticien-service:9092}

