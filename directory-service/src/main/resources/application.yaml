spring:
  application:
    name: directory-service

  flyway:
    baseline-on-migrate: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  grpc:
    server:
      port: ${DIRECTORY_GRPC_PORT:9096}

  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8899}"
      - "optional:vault:///secret/data/directory-service"

  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE

      app-role:
        role-id: ${DIRECTORY_VAULT_ROLE_ID}
        secret-id: ${DIRECTORY_VAULT_SECRET_ID}

      kv:
        enabled: true
        backend: secret
        backend-version: 2
