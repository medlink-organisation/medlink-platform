spring:
  application:
    name: directory-service-test

  datasource:
    url: jdbc:h2:mem:directory-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer

  cloud:
    config:
      enabled: false
    vault:
      enabled: false
    discovery:
      enabled: false
    bus:
      enabled: false

eureka:
  client:
    enabled: false

medlink:
  directory:
    data-initialization-enabled: false
