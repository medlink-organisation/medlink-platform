
syntax = "proto3";

package medilink.v1;

option java_multiple_files = true;
option java_package = "medlink.project.grpc.medicalrecord";

import "google/protobuf/timestamp.proto";

service MedicalRecordGrpcService {
  rpc GetRecordMetadata(GetRecordMetadataRequest)
      returns (RecordMetadataResponse);

  rpc AttachValidatedExam(AttachValidatedExamRequest)
      returns (AttachValidatedExamResponse);
}

message GetRecordMetadataRequest {
  int64 patient_id = 1;
}

message RecordMetadataResponse {
  int64 record_id = 1;
  int64 patient_id = 2;
}

message AttachValidatedExamRequest {
  int64 record_id = 1;
  int64 exam_id = 2;
  int64 praticien_id = 3;
  string idempotency_key = 4;
}

message AttachValidatedExamResponse {
  int64 exam_id = 1;
  int64 record_id = 2;
  google.protobuf.Timestamp attached_at = 3;
}
