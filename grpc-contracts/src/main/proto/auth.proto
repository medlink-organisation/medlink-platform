
syntax = "proto3";

package medilink.v1;

option java_multiple_files = true;
option java_package = "medlink.project.grpc.auth";

service AuthGrpcService {
  rpc GetUserContact(GetUserContactRequest)
      returns (UserContactResponse);
}

message GetUserContactRequest {
  string keycloak_id = 1;
}

message UserContactResponse {
  string keycloak_id = 1;
  string email = 2;
  string display_name = 3;
  bool enabled = 4;
}
