
syntax = "proto3";

package medilink.v1;

option java_multiple_files = true;
option java_package = "medlink.grpc.auth.v1";

service AuthGrpcService {
  rpc GetUserContact(GetUserContactRequest)
      returns (UserContactResponse);
  rpc GetPatientById(GetPatientByIdRequest)
      returns (PatientResponse);
  rpc GetAllPatients(GetPatientsRequest)
      returns (PatientPageResponse);
  rpc GetPatientByEmail(GetPatientByEmailRequest)
      returns (PatientResponse);
  rpc ExistsPatientById(GetPatientByIdRequest)
      returns (BooleanResponse);
  rpc ExistsPatientByEmail(GetPatientByEmailRequest)
      returns (BooleanResponse);
  rpc IsPatientActive(GetPatientByIdRequest)
      returns (BooleanResponse);
  rpc EnablePatient(GetPatientByIdRequest)
      returns (PatientResponse);
  rpc DisablePatient(GetPatientByIdRequest)
      returns (PatientResponse);
  rpc GetPatientRoles(GetPatientByIdRequest)
      returns (PatientRolesResponse);
  rpc UpdatePatientContact(UpdatePatientContactRequest)
      returns (PatientResponse);
}

message GetUserContactRequest {
  string keycloak_id = 1;
}

message UserContactResponse {
  string keycloak_id = 1;
  string email = 2;
  string display_name = 3;
  bool enabled = 4;
}

message GetPatientByIdRequest {
  string keycloak_id = 1;
}

message GetPatientByEmailRequest {
  string email = 1;
}

message GetPatientsRequest {
  int32 first = 1;
  int32 max = 2;
}

message PatientResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool enabled = 6;
  bool email_verified = 7;
}

message PatientPageResponse {
  repeated PatientResponse content = 1;
  int32 first = 2;
  int32 max = 3;
  bool has_next = 4;
}

message BooleanResponse {
  bool value = 1;
}

message PatientRolesResponse {
  repeated string roles = 1;
}

message UpdatePatientContactRequest {
  string keycloak_id = 1;
  optional string email = 2;
  optional string first_name = 3;
  optional string last_name = 4;
}
