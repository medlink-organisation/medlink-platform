syntax = "proto3";

package medlink.praticien.v1;

option java_multiple_files = true;
option java_package = "medlink.grpc.praticien.v1";
option java_outer_classname = "PraticienProto";

service PraticienGrpcService {

  rpc CreatePraticien(CreatePraticienGrpcRequest)
      returns (PraticienGrpcResponse);

  rpc GetPraticienByKeycloakId(GetPraticienByKeycloakIdRequest)
      returns (PraticienGrpcResponse);
  rpc GetPraticienById(GetPraticienByIdRequest)
      returns (PraticienGrpcResponse);
  rpc GetPraticiensByIds(GetPraticiensByIdsRequest)
      returns (PraticiensByIdsResponse);

  rpc ExistsActivePraticien(ExistsActivePraticienRequest)
      returns (ExistsActivePraticienResponse);
}

message CreatePraticienGrpcRequest {
  string keycloak_id = 1;
  string nom = 2;
  string prenom = 3;
  string email = 4;
  string phone = 5;
  string numero_ordre = 6;
  int64 specialite_id = 7;
}

message GetPraticienByKeycloakIdRequest {
  string keycloak_id = 1;
}
message GetPraticienByIdRequest {
  int64 praticien_id = 1;
}

message GetPraticiensByIdsRequest {
  repeated int64 praticien_ids = 1;
}

message PraticiensByIdsResponse {
  repeated PraticienGrpcResponse praticiens = 1;
}

message ExistsActivePraticienRequest {
  int64 praticien_id = 1;
}

message ExistsActivePraticienResponse {
  bool exists_and_active = 1;
}
message PraticienGrpcResponse {
  int64 id = 1;
  string keycloak_id = 2;
  string nom = 3;
  string prenom = 4;
  string email = 5;
  string phone = 6;
  string numero_ordre = 7;
  int64 specialite_id = 8;
  bool actif = 9;
  string specialite_nom = 10;
}
