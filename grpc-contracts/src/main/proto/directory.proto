
syntax = "proto3";

package medilink.v1;

option java_multiple_files = true;
option java_package = "medlink.grpc.directory.v1";

service DirectoryGrpcService {
  rpc GetClinicById(GetClinicByIdRequest)
      returns (ClinicResponse);

  rpc GetSpecialiteById(GetSpecialiteByIdRequest)
      returns (SpecialiteResponse);
}

message GetClinicByIdRequest {
  int64 clinique_id = 1;
}

message GetSpecialiteByIdRequest {
  int64 specialite_id = 1;
}

message ClinicResponse {
  int64 id = 1;
  string name = 2;
  bool active = 3;
}

message SpecialiteResponse {
  int64 id = 1;
  string name = 2;
}
