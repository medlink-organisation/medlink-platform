syntax = "proto3";

package medlink.auth.v1;

option java_multiple_files = true;
option java_package = "medlink.project.grpc.auth";

service AuthService {

  rpc CreatePraticienAccount(CreatePraticienAccountRequest)
      returns (CreatePraticienAccountResponse);

  rpc DeleteAccount(DeleteAccountRequest)
      returns (OperationResponse);
}


message CreatePraticienAccountRequest {

  string email = 1;

  string firstName = 2;

  string lastName = 3;
}


message CreatePraticienAccountResponse {

  string keycloakId = 1;

  string email = 2;
}


message DeleteAccountRequest {

  string keycloakId = 1;
}


message OperationResponse {

  bool success = 1;

  string message = 2;
}