spring:
  application:
    name: medical-record-service
  config:
    import:
      - "optional:configserver:${CONFIG_SERVICE_URL:}"
      - "vault:///secret/data/medical-record-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  grpc:
    server:
      port: ${MEDICAL_RECORD_GRPC_PORT:9095}
    client:
      channel:
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://localhost:9092}
        scheduling-service:
          target: ${SCHEDULING_GRPC_TARGET:static://localhost:9093}
        auth-service:
          target: ${AUTH_GRPC_TARGET:static://localhost:9091}

  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE

      app-role:
        role-id: ${MEDICAL_VAULT_ROLE_ID}
        secret-id: ${MEDICAL_VAULT_SECRET_ID}

      kv:
        enabled: true
        backend: secret
        backend-version: 2

---
spring:
  config:
    activate:
      on-profile: dev
  grpc:
    client:
      channel:
        praticien-service:
          target: ${PRATICIEN_GRPC_TARGET:static://praticien-service:9092}
        scheduling-service:
          target: ${SCHEDULING_GRPC_TARGET:static://scheduling-service:9093}
        auth-service:
          target: ${AUTH_GRPC_TARGET:static://auth-service:9091}
