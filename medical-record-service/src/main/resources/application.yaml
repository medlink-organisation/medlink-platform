spring:
  application:
    name: medical-record-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

medical:
  files:
    max-pdf-size-bytes: ${MEDICAL_PDF_MAX_SIZE_BYTES:10485760}

clamav:
  host: ${CLAMAV_HOST:clamav}
  port: ${CLAMAV_PORT:3310}
  timeout: ${CLAMAV_TIMEOUT:30000}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_MEDICAL_BUCKET:medilink-medical-private}
  allow-http: ${MINIO_ALLOW_HTTP:false}
  sse-kms-key-id: ${MINIO_SSE_KMS_KEY_ID:}
