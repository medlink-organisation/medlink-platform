spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:medical-record-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/test-jwks
eureka:
  client:
    enabled: false
security:
  jwt:
    resource-id: medical-record-service
medical:
  files:
    max-pdf-size-bytes: 10485760
clamav:
  host: localhost
  port: 3310
  timeout: 1000
minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: test-medical-private
  allow-http: true
